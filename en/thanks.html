<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Thank you! | Sit &amp; Care</title>
    <meta name="robots" content="noindex" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../img/logo.png" />
    <link rel="apple-touch-icon" href="../img/logo.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: "#f4f8f3",
                100: "#deeeda",
                200: "#bed9b8",
                300: "#97bf8f",
                500: "#6e9e66",
                600: "#5a8a52",
                700: "#4a7343",
                800: "#385933",
                900: "#243b21",
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      .container {
        max-width: 960px;
      }
    </style>
  </head>
  <body class="antialiased bg-white text-slate-800">
    <!-- Header -->
    <header
      class="sticky top-0 z-50 bg-white/90 backdrop-blur-sm border-b border-slate-100 shadow-sm"
    >
      <div
        class="mx-auto container px-4 py-3 flex items-center justify-between"
      >
        <a
          href="/en/"
          class="flex items-center gap-2.5 text-xl font-bold text-brand-700 tracking-tight"
        >
          <img
            src="../img/logo.png"
            alt=""
            class="h-10 w-auto"
            aria-hidden="true"
          />
          Sit &amp; Care
        </a>
        <button
          id="menuBtn"
          class="md:hidden p-2 rounded-lg text-slate-500 hover:bg-slate-100 transition-colors"
          aria-label="Open/close menu"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 20 20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M3 5h14M3 10h14M3 15h14" />
          </svg>
        </button>
        <nav id="desktopNav" class="hidden md:block">
          <ul class="flex items-center gap-1">
            <li>
              <a
                class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-brand-700 hover:bg-brand-50 transition-colors"
                href="/en/#about"
                >About</a
              >
            </li>
            <li>
              <a
                class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-brand-700 hover:bg-brand-50 transition-colors"
                href="/en/#motivation"
                >Why</a
              >
            </li>
            <li>
              <a
                class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-brand-700 hover:bg-brand-50 transition-colors"
                href="/en/#services"
                >Services</a
              >
            </li>
            <li>
              <a
                class="block px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:text-brand-700 hover:bg-brand-50 transition-colors"
                href="/en/#contact"
                >Contact</a
              >
            </li>
          </ul>
        </nav>
      </div>
      <div
        id="mobileNav"
        class="hidden md:hidden border-t border-slate-100 bg-white px-4 py-2"
      >
        <ul class="space-y-0.5">
          <li>
            <a
              class="block px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:text-brand-700 hover:bg-brand-50 transition-colors"
              href="/en/#about"
              >About us</a
            >
          </li>
          <li>
            <a
              class="block px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:text-brand-700 hover:bg-brand-50 transition-colors"
              href="/en/#motivation"
              >Why we do this</a
            >
          </li>
          <li>
            <a
              class="block px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:text-brand-700 hover:bg-brand-50 transition-colors"
              href="/en/#services"
              >Services</a
            >
          </li>
          <li>
            <a
              class="block px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 hover:text-brand-700 hover:bg-brand-50 transition-colors"
              href="/en/#contact"
              >Contact</a
            >
          </li>
        </ul>
      </div>
    </header>

    <!-- Thank you content -->
    <main
      class="flex flex-col items-center justify-center px-4 py-32 text-center"
    >
      <div
        class="w-16 h-16 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center mb-6"
      >
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 6L9 17l-5-5" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-slate-800 mb-3">
        Thank you for your message!
      </h1>
      <p class="text-lg text-slate-500 mb-8 max-w-md">
        We'll get back to you as soon as possible.
      </p>
      <a
        href="/en/"
        class="inline-flex items-center gap-2 bg-brand-700 text-white font-semibold px-7 py-3.5 rounded-xl hover:bg-brand-800 transition-colors"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M13 8H3M7 4L3 8l4 4" />
        </svg>
        Back to home
      </a>
    </main>

    <!-- Footer -->
    <footer class="py-8 px-4 bg-slate-900 text-slate-400">
      <div
        class="container mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-sm"
      >
        <a href="/en/" class="flex items-center gap-2 text-white font-semibold">
          <img
            src="../img/logo.png"
            alt="Sit &amp; Care"
            class="h-8 w-auto brightness-0 invert"
          />
          Sit &amp; Care
        </a>
        <p>© <span id="year"></span> Sit &amp; Care · Walldorf</p>
        <p class="flex gap-5">
          <a href="/en/privacy.html" class="hover:text-white transition-colors"
            >Privacy Policy</a
          >
        </p>
      </div>
    </footer>

    <script>
      document
        .getElementById("menuBtn")
        ?.addEventListener("click", () =>
          document.getElementById("mobileNav").classList.toggle("hidden"),
        );
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
